<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContextForge</title><style>:root{color-scheme:dark}body{margin:0;background:#0d1524;color:#eef4ff;font:15px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:28px 20px}h1{font-size:32px}section{background:#18263c;padding:20px;border:1px solid #344864;border-radius:12px;margin:16px 0}input,select,button{background:#223552;color:#fff;border:1px solid #5c789a;border-radius:8px;padding:9px;margin:4px}button{cursor:pointer;background:#176b87}a{color:#98dcf2}ul{padding-left:20px}li{padding:6px 0}.muted,small{color:#adc0d5}</style></head><body><main><h1>ContextForge</h1><p class="muted">Project context and permanent reports</p><section><label>Project <select id="project"></select></label><button id="refresh">Refresh index</button><p><input id="query" type="search" placeholder="Search context"><button id="search">Search</button></p><ul id="sources"></ul></section><section><h2>Reports</h2><input id="reportQuery" type="search" placeholder="Find reports"><button id="reportsButton">Find</button><ul id="reports"></ul></section></main><script>const $=id=>document.getElementById(id);async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error((await r.json()).error||r.status);return r.json()}function item(parent,label,href,detail){const li=document.createElement('li');const a=document.createElement('a');a.textContent=label;a.href=href;li.append(a);if(detail){const s=document.createElement('small');s.textContent=' · '+detail;li.append(s)}parent.append(li)}async function loadProjects(){const x=await api('/api/projects');for(const p of x.projects){const o=document.createElement('option');o.value=p.id;o.textContent=p.title;$('project').append(o)}await Promise.all([search(),reports()])}async function search(){const p=$('project').value;$('sources').replaceChildren();const x=await api('/api/context/search?projectId='+encodeURIComponent(p)+'&q='+encodeURIComponent($('query').value));for(const s of x.results)item($('sources'),s.title,'#'+encodeURIComponent(s.id),s.sourceType+' · '+s.path)}async function reports(){const p=$('project').value;$('reports').replaceChildren();const x=await api('/api/reports?projectId='+encodeURIComponent(p)+'&q='+encodeURIComponent($('reportQuery').value));for(const r of x.reports)item($('reports'),r.title,r.url,r.kind+' · '+r.createdAt)}$('project').addEventListener('change',()=>Promise.all([search(),reports()]));$('search').onclick=search;$('reportsButton').onclick=reports;$('refresh').onclick=async()=>{await api('/api/index/refresh',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projectId:$('project').value})});await search()};loadProjects().catch(e=>{$('sources').textContent=e.message})</script></body></html>
