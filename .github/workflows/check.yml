name: check

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm run check
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - name: Keep public workspace empty
        run: |
          test "$(git ls-files workspace | wc -l | tr -d ' ')" = "1"
          node -e "const x=require('./workspace/projects.json'); if (!Array.isArray(x.projects) || x.projects.length) process.exit(1)"

