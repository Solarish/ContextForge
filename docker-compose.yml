services:
  contextforge:
    container_name: contextforge
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8797:8787"
    environment:
      CONTEXTFORGE_PROJECTS_FILE: /app/workspace/projects.json
      CONTEXTFORGE_STATE_ROOT: /data/state
      CONTEXTFORGE_PUBLIC_BASE_URL: http://127.0.0.1:8797
      PORT: "8787"
      HOST: "0.0.0.0"
    volumes:
      - ./workspace/report:/app/workspace/report:ro
      - ./workspace/wiki:/app/workspace/wiki:ro
      - ./workspace/.state:/data/state
    restart: "no"
